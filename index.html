<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando sitio seguro...</title>

    <style>
        body {
            background-color: #0b132b;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: white;
        }
        .container {
            background-color: #1c2541;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            color: #bdc3c7;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            background-color: #00b4d8;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 18px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0077b6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Verificación requerida</h1>
        <p>Para continuar de forma segura, por favor presiona el botón para abrir en tu navegador externo:</p>
        
        <!-- Enlace con formato Intent para forzar la apertura en Chrome / navegador externo -->
        <a href="intent://o.uvixs.com/tr?offer_id=1&aff_id=71&sub1=Bancos#Intent;scheme=https;package=com.android.chrome;end;" class="btn">Continuar en el navegador</a>
    </div>

</body>
</html>
